name: Publicar Guías Programadas (Domingo, Martes y Jueves - 5 Ciudades) y Desplegar Web (QuePlanHoy)

on:
  push:
    branches: ["main"]
  schedule:
    # Domingo a las 09:00 AM (Hora España / 08:00 UTC): publica las 5 guías de Ruta de Otoño + Cocido / Plato de Cuchara (Madrid, Barcelona, Valencia, Sevilla y Toledo)
    - cron: '0 8 * * 0'
    # Martes a las 09:00 AM (Hora España / 08:00 UTC): publica las 5 guías de Mercadillos y Luces de Navidad 2026
    - cron: '0 8 * * 2'
    # Jueves a las 09:00 AM (Hora España / 08:00 UTC): publica las 5 guías de planes de Este Fin de Semana por ciudad
    - cron: '0 8 * * 4'
  workflow_dispatch:
    inputs:
      lote:
        description: 'Qué lote publicar manualmente (domingo, martes o jueves)'
        required: false
        default: 'domingo'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar-y-desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código de la web
        uses: actions/checkout@v4

      - name: Configurar Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar el Agente SEO (Domingo Ruta+Cocido, Martes Mercadillos Navidad o Jueves Fin de Semana)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.lote }}" = "jueves" ]; then
              python3 agent/seo_agent.py --thursday-weekend-all-cities
            elif [ "${{ github.event.inputs.lote }}" = "martes" ]; then
              python3 agent/seo_agent.py --tuesday-batch
            else
              python3 agent/seo_agent.py --sunday-batch
            fi
          else
            if [ "${{ github.event.schedule }}" = "0 8 * * 0" ]; then
              python3 agent/seo_agent.py --sunday-batch
            elif [ "${{ github.event.schedule }}" = "0 8 * * 2" ]; then
              python3 agent/seo_agent.py --tuesday-batch
            else
              python3 agent/seo_agent.py --thursday-weekend-all-cities
            fi
          fi
          git config user.name "Agente SEO HoyQuePlan"
          git config user.email "agente@queplanhoy.es"
          git add data/ public/
          git commit -m "chore(seo): publicar lote programado de 5 ciudades en QuePlanHoy" || echo "Sin cambios"
          git push

      - name: Auditoría de Calidad Editorial (Bloqueo anti-errores antes de publicar)
        run: |
          python3 -c "import json, sys; sys.path.insert(0, 'agent'); import build_site; build_site.validate_articles_quality(json.load(open('data/articles.json', encoding='utf-8'))); print('[OK] Auditoría de calidad superada al 100%')"


      - name: Configurar GitHub Pages (Hosting 0 €/mes)
        uses: actions/configure-pages@v5

      - name: Preparar carpeta pública de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar Web en Internet (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
