name: Publicar Planes Semanales (Martes, Miércoles y Jueves - 5 Ciudades) y Desplegar Web (QuePlanHoy)

on:
  push:
    branches: ["main"]
  schedule:
    # Martes a las 09:00 AM (Hora España): publica el primer reportaje semanal por ciudad (5 artículos: Madrid, Barcelona, Valencia, Sevilla y Toledo)
    - cron: '0 7 * * 2'
    # Miércoles a las 09:00 AM (Hora España): verifica/actualiza los planes de "Este Fin de Semana" de las 5 ciudades
    - cron: '0 7 * * 3'
    # Jueves a las 09:00 AM (Hora España): publica el segundo reportaje semanal por ciudad (5 artículos: Madrid, Barcelona, Valencia, Sevilla y Toledo)
    - cron: '0 7 * * 4'
  workflow_dispatch: # También permite pulsarlo manualmente con 1 clic desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar-y-desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código de la web
        uses: actions/checkout@v4

      - name: Configurar Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar el Agente SEO (Martes + Miércoles + Jueves 5 Ciudades)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 2" ]; then
            python3 agent/seo_agent.py --tuesday-batch
          elif [ "${{ github.event.schedule }}" = "0 7 * * 4" ]; then
            python3 agent/seo_agent.py --thursday-batch
          elif [ "${{ github.event.schedule }}" = "0 7 * * 3" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 agent/seo_agent.py --wednesday-all-cities
          else
            python3 agent/seo_agent.py --next
          fi
          git config user.name "Agente SEO HoyQuePlan"
          git config user.email "agente@queplanhoy.es"
          git add data/ public/
          git commit -m "chore(seo): publicar artículos programados en QuePlanHoy" || echo "Sin cambios"
          git push

      - name: Auditoría de Calidad Editorial (Bloqueo anti-errores antes de publicar)
        run: |
          python3 -c "import json, sys; sys.path.insert(0, 'agent'); import build_site; build_site.validate_articles_quality(json.load(open('data/articles.json', encoding='utf-8'))); print('[OK] Auditoría de calidad superada al 100%')"


      - name: Configurar GitHub Pages (Hosting 0 €/mes)
        uses: actions/configure-pages@v5

      - name: Preparar carpeta pública de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar Web en Internet (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
