name: Publicar Artículo SEO Cada 3 Días y Desplegar Web (QuePlanHoy)

on:
  push:
    branches: ["main"]
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 09:00 AM (Hora España)
    - cron: '0 7 */3 * *'
  workflow_dispatch: # También permite pulsarlo manualmente con 1 clic desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar-y-desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código de la web
        uses: actions/checkout@v4

      - name: Configurar Python 3
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar el Agente SEO (Siguiente Keyword de la Cola)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 agent/seo_agent.py --next
          git config user.name "Agente SEO HoyQuePlan"
          git config user.email "agente@queplanhoy.es"
          git add data/ public/
          git commit -m "chore(seo): publicar nuevo artículo automático de planes" || echo "Sin cambios"
          git push

      - name: Configurar GitHub Pages (Hosting 0 €/mes)
        uses: actions/configure-pages@v5

      - name: Preparar carpeta pública de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar Web en Internet (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
